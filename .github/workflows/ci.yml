name: CI

# T0.8 (docs/PLAN.md §3, docs/reviews/PURPLE_TEAM.md §P3): Windows-x64 only.
# No aarch64 job — cut per R-25/R-26/E6 (see PURPLE_TEAM.md §P1).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Never the real data dir — matches the mandatory agent-shell preamble
  # (PURPLE_TEAM.md §P5.3): tests only.
  FAMILY_HUB_DATA_DIR: ${{ github.workspace }}\.familyhub-ci-data

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install dx (dioxus-cli 0.7.10) and Tailwind standalone 3.4.17
        shell: pwsh
        run: |
          cargo binstall dioxus-cli@0.7.10 --no-confirm --locked
          $dest = "$env:USERPROFILE\.cargo\bin\tailwindcss.exe"
          Invoke-WebRequest -Uri "https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-windows-x64.exe" -OutFile $dest
          # The standalone binary has no --version flag (it exits 9 treating it
          # as a missing input file); --help exits 0 and prints the version.
          $banner = & $dest --help 2>&1 | Out-String
          if ($banner -notmatch 'tailwindcss v3\.4\.17') {
            Write-Error "expected tailwindcss v3.4.17, got: $banner"
            exit 1
          }

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (server + web, -D warnings)
        shell: pwsh
        run: |
          cargo clippy --features server --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --features web --target wasm32-unknown-unknown -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cargo test --features server
        run: cargo test --features server

      - name: dx build --platform web --release
        run: dx build --platform web --release

      - name: Tailwind rebuild (fail on diff)
        shell: pwsh
        run: |
          $before = Get-FileHash assets/tailwind.css -Algorithm SHA256
          & "$env:USERPROFILE\.cargo\bin\tailwindcss.exe" -i input.css -o assets/tailwind.css --minify
          $after = Get-FileHash assets/tailwind.css -Algorithm SHA256
          if ($before.Hash -ne $after.Hash) {
            Write-Error "assets/tailwind.css is stale relative to input.css/tailwind.config.js — rebuild it locally with tailwindcss-windows-x64 v3.4.17 and commit the diff"
            git diff -- assets/tailwind.css
            exit 1
          }
          Write-Host "assets/tailwind.css matches a clean rebuild"

      - name: cargo tree -d duplicate check
        shell: pwsh
        run: |
          $dups = cargo tree -d --features server | Select-String -Pattern '^(axum|tower-http|hyper) v'
          if ($dups) {
            Write-Error "duplicate axum/tower-http/hyper major versions found in the dependency tree (W8):"
            $dups | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "no duplicate axum/tower-http/hyper versions in the dependency tree"

      - name: Windows-x64 release build
        shell: pwsh
        run: |
          # Q1-01: the binary the owner installs as the service is
          # `family-hub.exe` (src/bin/family_hub.rs), not the Dioxus
          # fullstack app's own `src/main.rs` binary — and it needs the
          # `dx build` client bundle (already produced above) copied beside
          # it or the kiosk never hydrates. This step assembles both into
          # one shippable directory and fails the build if the bundle is
          # missing, rather than silently archiving nothing usable.
          cargo build --features server --release --bin family-hub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/FamilyHub | Out-Null
          Copy-Item target/release/family-hub.exe dist/FamilyHub/
          Copy-Item -Recurse target/dx/family-calendar/release/web/public dist/FamilyHub/public
          if (-not (Get-ChildItem dist/FamilyHub/public/assets -Filter *.wasm -ErrorAction SilentlyContinue)) {
            Write-Error "dist/FamilyHub/public/assets has no .wasm bundle — nothing shippable was produced"
            exit 1
          }
          Write-Host "assembled dist/FamilyHub: family-hub.exe + public/ (with a wasm bundle)"

      - name: Upload FamilyHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyHub-windows-x64
          path: dist/FamilyHub
