[package]
name = "family-calendar"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["xtask"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"
# T1.3: the join-QR SVG is rendered by a client component that compiles for
# both `web` (wasm32) and `server` (SSR), so `fast_qr` is not feature-gated.
fast_qr = { version = "=0.13.1", default-features = false, features = ["svg"] }

# Web-only dependencies, gated behind the `web` feature.
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
gloo-net = { version = "0.6", features = ["websocket"], default-features = false, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "DomRect",
    "Location",
    "EventTarget",
    "Navigator",
    "ServiceWorkerContainer",
    "ServiceWorker",
    "ResizeObserver",
    # QD-02 / QD-08: `Element::scroll_into_view_with_scroll_into_view_options`
    # with `block: "nearest"` — how the kiosk's virtual D-pad focus moves the
    # viewport, since DOM focus never leaves the keyboard host.
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "File",
    "Blob",
    "FormData",
    "Performance",
], optional = true }

# Server-only dependencies, gated behind the `server` feature.
tokio = { version = "1.42", features = ["full"], optional = true }
sqlx = { version = "=0.8.6", features = [
    "sqlite",
    "runtime-tokio",
    "chrono",
], optional = true }
axum = { version = "=0.8.9", features = ["ws"], optional = true }
tower-http = { version = "=0.6.8", features = ["fs", "trace"], optional = true }
chrono = { version = "0.4", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false, optional = true }
jsonwebtoken = { version = "9", optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
image = { version = "0.25", optional = true }
# T1.4 — parent PIN hashing (PURPLE_TEAM.md §P5.4: pinned exactly, "0.5.x-era
# `password-hash` snippets will not compile" — true here too: 0.6.0's
# `PasswordHasher::hash_password` dropped the explicit-salt parameter
# entirely, generating one internally via the default `getrandom` feature).
# Default features (`alloc`, `getrandom`, `password-hash`) are exactly what's
# needed, including for the one place T1.4 still needs raw randomness itself
# outside of hashing: the six-digit first-run setup code, generated via the
# same `password_hash::try_generate_salt()` the crate's own salt generation
# uses (rand_core 0.10 dropped the `OsRng` type password-hash 0.5-era code
# reached for; there is no reason to hand-roll a second RNG path when this
# one is already exposed).
argon2 = { version = "=0.6.0", optional = true }

# T2.4 — local recurring events. Server-only: recurrence is expanded on the
# hub and the surfaces receive already-expanded occurrences, so the wasm
# bundle never carries a timezone database. PURPLE_TEAM.md §P5.4 pins this
# exactly and forbids `all_unchecked()` — every expansion here goes through
# `all(limit)`, which returns `RRuleResult { dates, limited }` and can never
# run away on a pathological rule. `rrule` pulls `chrono-tz` in itself, which
# is what makes `DTSTART;TZID=America/New_York:...` resolve real DST offsets.
rrule = { version = "=0.14.0", optional = true }

# T1.3 — TLS + PKI + dual listener + mDNS (PLAN v2 D3′, PURPLE_TEAM.md §P5.4).
# `ring`, never `aws-lc-rs`: aws-lc-rs needs CMake + NASM on Windows. Every
# crate below therefore turns its default features off, because both
# `tokio-rustls` and `rcgen` default to aws-lc-rs / a mixed provider set, and
# rustls panics at runtime when two providers are compiled in without an
# explicit `CryptoProvider::install_default`.
rustls = { version = "=0.23.43", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
    "std",
], optional = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
], optional = true }
# `hyper-util`'s auto (h1/h2) server — deliberately NOT `axum-server`
# (PURPLE_TEAM.md §P5.4: 0.8.0 is ~9 months stale and its dev-deps are still
# on axum 0.7).
hyper-util = { version = "=0.1.20", features = [
    "server",
    "server-auto",
    "http1",
    "http2",
    "tokio",
    "service",
], optional = true }
hyper = { version = "=1.11.1", features = ["server", "http1", "http2"], optional = true }
rcgen = { version = "=0.14.10", default-features = false, features = [
    "ring",
    "pem",
    "x509-parser",
], optional = true }
x509-parser = { version = "=0.18.1", optional = true }
time = { version = "0.3", default-features = false, features = [
    "std",
], optional = true }
mdns-sd = { version = "=0.21.0", optional = true }
# Host IPv4 enumeration for the leaf's SAN list and the mDNS A record.
# `mdns-sd` already pulls this exact version in, so it adds no new subtree.
if-addrs = { version = "=0.15.0", optional = true }

# T3.1 — Windows service host (PLAN v2 D9, PURPLE_TEAM.md §P5.4). Windows-only
# by nature (wraps the Service Control Manager); this project targets Windows
# exclusively (no aarch64/Linux job — T0.8), so it is added unconditionally
# under the `server` feature like every other server-only crate rather than
# behind an extra `cfg(windows)` target table. `src/server/service.rs` guards
# its own body with `#[cfg(windows)]` anyway so `cargo check --features
# server` still type-checks off Windows.
windows-service = { version = "=0.8.1", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.28"
image = "0.25"
# T1.3 acceptance (g): the QR *SVG* is rasterised (`resvg`, which re-exports
# the `tiny_skia` pixmap it renders into) and decoded back to its payload by
# an independent reader (`rqrr`), so the assertion covers the real rendered
# component output rather than the encoder's own matrix.
resvg = "=0.45.1"
rqrr = "=0.10.1"

[features]
default = []
web = [
    "dioxus/web",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:sqlx",
    "dep:axum",
    "dep:tower-http",
    "dep:chrono",
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:tracing",
    "dep:uuid",
    "dep:image",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rcgen",
    "dep:x509-parser",
    "dep:time",
    "dep:mdns-sd",
    "dep:if-addrs",
    "dep:argon2",
    "dep:rrule",
    "dep:windows-service",
]

[[bin]]
# T3.1 (PLAN v2 D9): the Windows service host / CLI —
# `family-hub.exe install|uninstall|start|stop|status|run|tv-probe`. A
# separate binary target rather than a mode of the frozen `src/main.rs`
# (`docs/reviews/PURPLE_TEAM.md` §P4: `src/main.rs` "T0.6 owner, none
# [later], frozen"): `main.rs` is Dioxus's own fullstack entry point (it
# `dioxus::launch`es the client app off the `server` feature and hands the
# server feature straight to `router::run` with no subcommands at all), and
# growing subcommand parsing, SCM plumbing and a dedicated logger into it
# would be exactly the edit §P4 forbids. `family-hub.exe` reuses every piece
# of the existing server (`router::run`, `config::FamilyHubConfig`,
# `backup::rotate_log_if_needed`) from its own `main()` instead of
# duplicating any of it.
name = "family-hub"
path = "src/bin/family_hub.rs"
required-features = ["server"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# T2.5: `cargo test`'s default (unoptimized) build makes the `image` crate's
# pure-Rust JPEG/PNG codecs (`zune-jpeg`, `png`) roughly an order of magnitude
# slower than a release build — PURPLE §P3 T2.5(a)'s "< 3 s for a 12 MP
# photo" budget is unreachable at `opt-level = 0` on this box, not because
# `api::photos::upload_photo_handler`'s own decode/resize/encode is slow, but
# because those two dependencies are. `[profile.dev.package.*]` overrides let
# only the pixel-crunching dependencies build optimized while the crate's own
# code (including this one) keeps fast incremental compiles and full debug
# info — the standard idiom for exactly this class of problem, not a change
# to the shipped release binary (already `opt-level = "z"`). `cargo test`'s
# `test` profile inherits `dev`'s package overrides, so this applies there
# too without a separate `[profile.test]` section.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
