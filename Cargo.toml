[package]
name = "family-calendar"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["xtask"]

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"

# Web-only dependencies, gated behind the `web` feature.
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
gloo-net = { version = "0.6", features = ["websocket"], default-features = false, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "DomRect",
    "Location",
    "EventTarget",
    "Navigator",
    "ServiceWorkerContainer",
    "ServiceWorker",
    "ResizeObserver",
    "File",
    "Blob",
    "FormData",
    "Performance",
], optional = true }

# Server-only dependencies, gated behind the `server` feature.
tokio = { version = "1.42", features = ["full"], optional = true }
sqlx = { version = "=0.8.6", features = [
    "sqlite",
    "runtime-tokio",
    "chrono",
], optional = true }
axum = { version = "=0.8.9", features = ["ws"], optional = true }
tower-http = { version = "=0.6.8", features = ["fs", "trace"], optional = true }
chrono = { version = "0.4", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
jsonwebtoken = { version = "9", optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
image = { version = "0.25", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.28"
image = "0.25"

[features]
default = []
web = [
    "dioxus/web",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:sqlx",
    "dep:axum",
    "dep:tower-http",
    "dep:chrono",
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:tracing",
    "dep:uuid",
    "dep:image",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
